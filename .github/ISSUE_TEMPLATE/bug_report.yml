name: Bug report
description: Report a problem with an example or the public API documentation.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove API keys, tokens, sign-in links, and personal account information before posting."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the example or endpoint, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use placeholder credentials only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.12 / macOS, or Node.js 24 / Windows"
